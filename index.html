<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Select a city..</option>
        <option value="">New York</option>
        <option value="">Paris</option>
        <option value="">Honolulu</option>
      </select>

      <div class="city">
        <div>
          <h2>Houston</h2>
          <div class="date">July 23, 2026</div>
        </div>
        <div class="time">10:01:36 <small>PM</small></div>
      </div>
      <div class="city">
        <div>
          <h2>Sydney</h2>
          <div class="date">July 23, 2026</div>
        </div>
        <div class="time">10:01:36 <small>PM</small></div>
      </div>
    </div>
    <footer>
      Coded by
      <a href="https://github.com/ewilson001500-tech" target="_blank"
        >Erin Wilson</a
      >
      and is open sourced on
      <a
        href="https://github.com/ewilson001500-tech/world-clock"
        target="_blank"
        >Github</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
